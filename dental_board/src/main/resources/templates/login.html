<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | スマート診療タスク</title>
    <!-- フォントとアイコンの読み込み（FontAwesome） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        body {
            background-color: #eef7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #334155;
        }

        .login-container {
            display: flex;
            width: 800px;
            max-width: 90%;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        /* 左側：ブランディングエリア */
        .brand-section {
            flex: 1;
            padding-right: 40px;
            text-align: center;
        }

        .tooth-icon {
            font-size: 60px;
            color: #3b82f6;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 28px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: #475569;
            margin-bottom: 24px;
        }

        .brand-description {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
        }

        /* 右側：ログインフォームカード */
        .form-section {
            width: 360px;
            background: #ffffff;
            border-radius: 16px;
            padding: 36px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .form-title {
            font-size: 20px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 20px;
        }

        /* ★追加：エラーメッセージ用スタイル */
        .alert-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: #94a3b8;
            font-size: 14px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #3b82f6;
        }

        .input-wrapper input::placeholder {
            color: #cbd5e1;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #2563eb;
        }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #3b82f6;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- 左側ロゴ・メッセージエリア -->
        <div class="brand-section">
            <div class="tooth-icon">
                <i class="fa-solid fa-tooth"></i>
            </div>
            <h1 class="brand-title">スマート診療タスク</h1>
            <p class="brand-subtitle">メンテナンス管理システム</p>
            <p class="brand-description">
                診療の「やること」が見える化し<br>
                患者さんによりよいケアを。
            </p>
        </div>

        <!-- 右側入力フォームエリア -->
        <div class="form-section">
            <h2 class="form-title">ログイン</h2>
            
            <!-- ★追加：ログイン失敗時にエラーメッセージを表示する領域 -->
            <div th:if="${param.error}" class="alert-error">
                社員番号またはパスワードが違います。
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>社員番号</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <!-- name="username" でOKです（Spring Security標準の受取名） -->
                        <input type="text" name="staff_id" placeholder="例）DH001" required />
                    </div>
                </div>

                <div class="form-group">
                    <label>パスワード</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <!-- name="password" でOKです -->
                        <input type="password" name="password" placeholder="パスワードを入力" required />
                    </div>
                </div>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-submit">ログイン</button>
            </form>

            
        </div>
    </div>

</body>
</html>
