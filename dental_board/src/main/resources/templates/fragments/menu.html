<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <nav class="sidebar" th:fragment="menu">

		<!-- 診療スケジュール -->
		<a th:href="@{/}"
		   class="nav-button"
		   th:classappend="${page == null or page == 'schedule'} ? ' active' : ''">
		    診療スケジュール
		</a>

		<!-- 患者一覧 -->
		<a th:href="@{/patients}"
		   class="nav-button"
		   th:classappend="${page == 'patients'} ? ' active' : ''">
		    患者一覧
		</a>

		<!-- 予約 -->
		<a th:href="@{/reservations}"
		   class="nav-button"
		   th:classappend="${page == 'reservations'} ? ' active' : ''">
		    予約
		</a>

        <!-- ログアウト -->
        <form th:action="@{/logout}" method="post" class="logout-form mt-auto">
            <button type="submit"
                    class="nav-button logout-btn w-full text-left">
                ログアウト
            </button>
        </form>

    </nav>

</body>
</html>
