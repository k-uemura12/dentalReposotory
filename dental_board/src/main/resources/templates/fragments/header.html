<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- CSSファイルの読み込み（全体共通のstyle.cssを使っている場合はそちらを指定してください） -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- ヘッダーフラグメント -->
    <header th:fragment="header" class="header-container">
        
		<!-- 左：タイトル -->
		        <div class="header-title">
		             <img src="/images/dental-clinic-icon.png" alt="歯医者のアイコン" class="first-icon">うえむら歯科クリニック
		        </div>

        <!-- 中央：日付コントローラー -->
        <div class="date-controller">
            <a th:href="@{/(date=${prevDate})}" class="date-btn">&lt;</a>
            
            <form id="dateForm" th:action="@{/}" method="get" class="date-form">
				<div class="date-display-wrapper"
				     th:classappend="${!isToday} ? 'not-today'"
				     title="クリックして日付を選択">

				    <svg class="warning-icon" viewBox="0 0 24 24">
				        <path d="M12 2L1 21h22L12 2zm0 3.5L20.5 19h-17L12 5.5zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"></path>
				    </svg>

				    <svg class="calendar-icon" viewBox="0 0 24 24">
				        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
				        <line x1="16" y1="2" x2="16" y2="6"></line>
				        <line x1="8" y1="2" x2="8" y2="6"></line>
				        <line x1="3" y1="10" x2="21" y2="10"></line>
				    </svg>

				    <span class="date-display"
				          th:text="${displayDate}">
				        2026年9月13日 (日)
				    </span>

				    <input type="date"
				           id="datePicker"
				           name="date"
				           th:value="${currentDate}"
				           onchange="submitDate()"
				           class="hidden-date-picker">
				</div>
				<script>
				function submitDate() {
				    document.getElementById('dateForm').submit();
				}
				</script>
            </form>

            <a th:href="@{/(date=${nextDate})}" class="date-btn">&gt;</a>
        </div>

		<!-- 右：ユーザー情報 -->
		        <div class="header-user">
		            <span class="user-greeting">
		                <img src="/images/header-icon.png" alt="歯のアイコン" class="second-icon">こんにちは、
		                <span th:text="${staffName != null ? staffName : '管理者'}">上村佳奈</span>さん
		            </span>
		        </div>

    </header>
	

      
		   
	 </body>
      </html>
