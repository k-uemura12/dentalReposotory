<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- ==========================================
       ユーティリティペイン（右側エリア）
       ========================================== -->
    <aside th:fragment="utility" class="utility-pane w-[340px] bg-white border-l border-[#e0e0e0] p-5 flex flex-col shrink-0 overflow-y-auto shadow-lg h-full min-h-[calc(100vh-80px)]">
        
        <!-- 右側のユーティリティペイン全体 -->
        <div class="utility-pane">
            
            <!-- 患者ヘッダー（アイコン ＋ 名前） -->
            <div class="patient-header">
                <div class="patient-avatar-wrapper">
                    <img src="/images/patient-icon.png" alt="患者アイコン" class="patient-icon">
                </div>
				<div class="patient-info-group">
				                    <span id="detail-patient-name" class="patient-name">田中 花子 さん</span>
				                    <span class="patient-time">9:00 予約</span>
				                </div>
				            </div>

				            <!-- ① 今日の予定セクション -->
				            <div class="detail-card">
				                <h4 class="card-title">今日の予定 </h4>
				                <div class="checkbox-group">
				                    <label class="checkbox-item">
				                        <div class="checkbox-left">
				                            <input type="checkbox" checked class="custom-checkbox">
				                            <span>歯周検査</span>
				                        </div>
				                        <span class="period-badge badge-orange">4ヶ月前</span>
				                    </label>
				                    <label class="checkbox-item">
				                        <div class="checkbox-left">
				                            <input type="checkbox" checked class="custom-checkbox">
				                            <span>レントゲン</span>
				                        </div>
				                        <span class="period-badge badge-green">8ヶ月前</span>
				                    </label>
				                    <label class="checkbox-item">
				                        <div class="checkbox-left">
				                            <input type="checkbox" class="custom-checkbox">
				                            <span>マウスピース</span>
				                        </div>
				                        <span class="period-badge badge-gray">前回あり</span>
				                    </label>
				                    <label class="checkbox-item">
				                        <div class="checkbox-left">
				                            <input type="checkbox" class="custom-checkbox">
				                            <span>フッ素塗布</span>
				                        </div>
				                        <span class="period-badge badge-red">23日前</span>
				                    </label>
				                </div>
				            </div>

				            <!-- ② 前回の診療セクション -->
				            <div class="detail-card">
				                <h4 class="card-title">前回の診療 </h4>
				                <div class="history-list">
				                    <div class="history-item">
				                        <span class="history-name">歯周検査</span>
				                        <span class="history-date">2026/05/12 <span class="history-ago">(4ヶ月前)</span></span>
				                    </div>
				                    <div class="history-item">
				                        <span class="history-name">レントゲン</span>
				                        <span class="history-date">2026/01/10 <span class="history-ago">(8ヶ月前)</span></span>
				                    </div>
				                    <div class="history-item">
				                        <span class="history-name">マウスピース</span>
				                        <span class="history-date">2026/05/12 <span class="history-ago">(4ヶ月前)</span></span>
				                    </div>
				                    <div class="history-item">
				                        <!-- 空欄だった部分に項目名を追加 -->
				                        <span class="history-name">フッ素塗布</span>
				                        <span class="history-date">2026/06/20 <span class="history-ago">(23日前)</span></span>
				                    </div>
				                </div>
				            </div>

				            <!-- ③ カルテメモセクション（テキストエリア版） -->
				            <div class="detail-card">
				                <h4 class="card-title">
				                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: middle;">
				                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
				                        <polyline points="14 2 14 8 20 8"></polyline>
				                        <line x1="16" y1="13" x2="8" y2="13"></line>
				                        <line x1="16" y1="17" x2="8" y2="17"></line>
				                        <polyline points="10 9 9 9 8 9"></polyline>
				                    </svg>
				                    カルテメモ
				                </h4>
				                <textarea class="memo-textarea" placeholder="カルテメモを入力してください..."></textarea>
				            </div>

				            <!-- 予定を保存ボタン -->
				            <div class="button-container">
				                <button type="button" class="save-btn">実施内容を保存</button>
				            </div>
				           
				        </div>
				    </aside>
				</body>
				</html>
