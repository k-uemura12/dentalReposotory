<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="contentsPatients">

    <div class="patients-header">

        <h1 class="patients-title">
            患者一覧
        </h1>

        <input
            type="text"
            class="patient-search"
            placeholder="患者名・患者番号で検索">
    </div>


    <div class="patients-card">

        <table class="patients-table">

            <thead>
                <tr>
                    <th>患者番号</th>
                    <th>患者氏名</th>
                    <th>性別</th>
                    <th>生年月日</th>
                    <th>最終来院日</th>
                    <th>メモ</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="patient : ${patients}">

                    <td th:text="${patient.patientNumber}">
                        P0101
                    </td>

                    <td th:text="${patient.name}">
                        田中 花子
                    </td>

                    <td>
                        <span class="gender-badge"
                              th:classappend="${patient.gender == '女性'} ? ' female' : ' male'"
                              th:text="${patient.gender}">
                            女性
                        </span>
                    </td>

                    <td th:text="${patient.birthday}">
                        1985/04/12
                    </td>

                    <td th:text="${patient.lastVisit}">
                        2026/08/08
                    </td>

                    <td th:text="${patient.memo}">
                        メンテナンス
                    </td>

                    <td class="patient-arrow">
                        ＞
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
